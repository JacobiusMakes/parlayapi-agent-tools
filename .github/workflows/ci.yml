name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,langchain,llamaindex]"
      # Network tests are opt in, so a parlay-api.com blip cannot redden a PR.
      - run: pytest -q -m "not network"
      - run: ruff check .

  core-without-frameworks:
    # The core client must import and work with no third party package
    # installed at all. This job is the guard on that promise.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - run: python -c "from parlayapi_tools import ParlayAPIClient; print(ParlayAPIClient())"
      - run: python -c "from parlayapi_tools.openai_schemas import OPENAI_TOOLS; print(len(OPENAI_TOOLS))"
      - run: pytest -q -m "not network" tests/test_demo_parsing.py tests/test_client_requests.py tests/test_schemas.py
